[workspace]
members = ["py"]
default-members = [".", "py"]

[workspace.package]
version = "0.1.11"
edition = "2024"

[package]
name = "aihist"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "Turn notebook dialogs into LLM input, and chats into dialog text and back"
repository = "https://github.com/AnswerDotAI/aihist"

[lib]
name = "aihist"
doctest = false
test = false

[features]
default = ["full"]
full = [
    "dep:base64",
    "dep:data-encoding",
    "dep:flate2",
    "dep:image",
    "dep:md-5",
    "dep:mime_guess",
    "dep:percent-encoding",
    "dep:regex",
    "dep:reqwest",
    "dep:rgapi",
    "dep:serde",
]

[dependencies]
base64 = { version = "0.22", optional = true }
data-encoding = { version = "2", optional = true }
flate2 = { version = "1", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"], optional = true }
md-5 = { version = "0.10", optional = true }
mime_guess = { version = "2", optional = true }
percent-encoding = { version = "2", optional = true }
regex = { version = "1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
rgapi = { version = "0.2.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.test]
inherits = "release"

[profile.release]
lto = false
codegen-units = 16

[profile.release.package.aihist]
incremental = true

[profile.release.package.aihist-py]
incremental = true

[profile.dist]
inherits = "release"
lto = true
incremental = false
codegen-units = 1
strip = true

[profile.dist.package.aihist]
incremental = false

[profile.dist.package.aihist-py]
incremental = false
