[workspace]
members = ["py"]
default-members = [".", "py"]

[workspace.package]
version = "0.1.3"
edition = "2024"

[package]
name = "aihist"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "Turn notebook dialogs into LLM input, and chats into dialog text and back"
repository = "https://github.com/AnswerDotAI/aihist"

[lib]
name = "aihist"

[dependencies]
base64 = "0.22"
data-encoding = "2"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
md-5 = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.test]
inherits = "release"

[profile.release]
lto = false
codegen-units = 16

[profile.release.package.aihist]
incremental = true

[profile.release.package.aihist-py]
incremental = true

[profile.dist]
inherits = "release"
lto = true
incremental = false
codegen-units = 1
strip = true

[profile.dist.package.aihist]
incremental = false

[profile.dist.package.aihist-py]
incremental = false
