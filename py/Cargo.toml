[package]
name = "aihist-py"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
test = false

[dependencies]
aihist = { path = ".." }
pyo3 = { version = ">=0.29", features = ["extension-module"] }
rgapi = "0.2.0"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }

[build-dependencies]
pyo3-build-config = ">=0.29"
