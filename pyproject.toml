[build-system]
requires = ["maturin>=1.0,<2.0", "fastws-cli>=0.0.42"]
build-backend = "fastws.build_backend"

[project]
name = "aihist"
dynamic = ["version"]
description = "Turn notebook dialogs into LLM input, and chats into dialog text and back"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Jeremy Howard", email = "github@jhoward.fastmail.fm"}]
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: Implementation :: CPython"]
dependencies = ['aidialog>=0.0.42', 'fastcore>=2.2.31']

[project.optional-dependencies]
test = ["fastws-cli>=0.0.42", "pytest"]
dev = ["fastship>=0.0.11", "maturin>=1.0,<2.0", "aihist[test]"]

[project.urls]
Homepage = "https://github.com/AnswerDotAI/aihist"
Repository = "https://github.com/AnswerDotAI/aihist"
Issues = "https://github.com/AnswerDotAI/aihist/issues"

Documentation = "https://AnswerDotAI.github.io/aihist/"
[tool.fastship]
branch = "main"

[tool.maturin]
manifest-path = "py/Cargo.toml"
python-source = "python"
module-name = "aihist._core"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "py/Cargo.toml" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
